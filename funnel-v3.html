<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build your AdmitMap report</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-variant-numeric:lining-nums tabular-nums}

    :root{
      --white:#fff; --off:#f8fafc; --navy:#0f1f4b; --royal:#2563eb; --royal-mid:#3b82f6;
      --royal-s:#eef4ff; --royal-light:#dbeafe; --muted:#64748b; --muted-2:#94a3b8;
      --line:#e2e8f0; --line-soft:#e6ebf4; --ok:#10b981; --err:#ef4444; --amber:#f59e0b;
      --purple:#7c3aed;
      --ease:cubic-bezier(.23,1,.32,1);
      --card-w:940px;
      --btn-w:240px;          /* Back and Continue share this exactly */
    }

    html,body{height:100%}
    body{
      font-family:'Syne',system-ui,sans-serif; color:var(--navy);
      background:
        radial-gradient(1100px 700px at 88% 0%, rgba(37,99,235,.13) 0%, transparent 62%),
        radial-gradient(800px 620px at 2% 100%, rgba(37,99,235,.10) 0%, transparent 60%),
        linear-gradient(168deg,#fdfeff 0%,#f4f8ff 46%,#eaf1fe 100%);
      display:flex; flex-direction:column; min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }

    /* ── PROGRESS ── */
    .prog{position:sticky;top:0;z-index:30;background:var(--white);border-bottom:1px solid var(--line-soft);
      padding:14px 28px}
    .prog-track{height:7px;border-radius:99px;background:#e2e8f0;overflow:hidden;max-width:1760px;margin:0 auto}
    .prog-fill{height:100%;border-radius:99px;background:var(--royal);width:0%;
      transition:width .45s var(--ease)}

    /* ── STAGE ── */
    .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:44px 24px}

    .card{
      width:100%;max-width:var(--card-w);background:var(--white);border-radius:22px;
      padding:56px 64px 60px;box-shadow:0 1px 2px rgba(15,31,75,.04),0 18px 44px -12px rgba(15,31,75,.13);
      animation:cardIn .42s var(--ease) both;
    }
    @keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.995)}to{opacity:1;transform:none}}
    .card.back{animation:cardBack .42s var(--ease) both}
    @keyframes cardBack{from{opacity:0;transform:translateY(-10px) scale(.995)}to{opacity:1;transform:none}}

    h1.q{font-family:'Fraunces',serif;font-size:clamp(28px,3.4vw,44px);font-weight:700;line-height:1.1;
      letter-spacing:-.015em;text-align:center;color:var(--navy)}
    h1.q em{font-style:italic;color:var(--royal)}
    p.sub{margin-top:14px;text-align:center;font-size:16px;font-weight:500;color:var(--muted);line-height:1.55}

    .body{margin-top:38px}

    /* ── FIELDS ── */
    .row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .fi{width:100%;padding:17px 20px;border:1.5px solid var(--line);border-radius:13px;background:var(--white);
      font-family:'Syne',sans-serif;font-size:16px;font-weight:600;color:var(--navy);outline:none;
      transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
    .fi::placeholder{color:var(--muted-2);font-weight:500}
    .fi:focus{border-color:var(--royal);box-shadow:0 0 0 4px var(--royal-s)}
    .fi.bad{border-color:var(--err)}
    select.fi{appearance:none;cursor:pointer;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' stroke='%2364748b' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat:no-repeat;background-position:right 20px center;padding-right:48px}
    textarea.fi{min-height:230px;resize:vertical;line-height:1.65;font-weight:500}
    .fl{display:block;margin-bottom:9px;font-size:13px;font-weight:700;color:var(--navy);letter-spacing:.01em}
    .fh{margin-top:8px;font-size:13px;color:var(--muted);font-weight:500}
    .err{margin-top:12px;font-size:14px;font-weight:600;color:var(--err);text-align:center;display:none}
    .err.on{display:block}

    /* ── CHOICES (one-tap) ── */
    .choices{display:flex;flex-direction:column;gap:12px;max-width:660px;margin:0 auto}
    .choice{display:flex;align-items:center;gap:15px;width:100%;text-align:left;cursor:pointer;
      padding:19px 22px;border:1.5px solid var(--line);border-radius:14px;background:var(--white);
      font-family:'Syne',sans-serif;font-size:15.5px;font-weight:600;color:var(--navy);
      transition:border-color .16s var(--ease),background .16s var(--ease),transform .16s var(--ease)}
    .choice:hover{border-color:var(--royal-mid);background:#fbfdff;transform:translateY(-1px)}
    .choice.on{border-color:var(--royal);background:var(--royal-s);box-shadow:0 0 0 3px rgba(37,99,235,.09)}
    .choice .dot{flex:0 0 21px;height:21px;border-radius:50%;border:2px solid var(--line);
      display:grid;place-items:center;transition:border-color .16s var(--ease)}
    .choice.on .dot{border-color:var(--royal)}
    .choice.on .dot::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--royal)}
    .choice.sq .dot{border-radius:6px}
    .choice.sq.on .dot::after{border-radius:2px;width:9px;height:9px}

    /* ── CHIPS ── */
    .chips{display:flex;flex-wrap:wrap;gap:10px}
    .chip{padding:10px 17px;border:1.5px solid var(--line);border-radius:99px;background:var(--white);
      font-family:'Syne',sans-serif;font-size:14px;font-weight:600;color:var(--navy);cursor:pointer;
      transition:all .16s var(--ease)}
    .chip:hover{border-color:var(--royal-mid)}
    .chip.on{background:var(--royal);border-color:var(--royal);color:#fff}

    /* ── SLIDER ── */
    .sl-val{text-align:center;font-family:'Fraunces',serif;font-size:46px;font-weight:700;color:var(--royal);
      line-height:1.05}
    .sl-cap{text-align:center;font-size:14px;color:var(--muted);font-weight:500;margin-top:6px}
    input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:7px;border-radius:99px;
      background:var(--line);outline:none;margin:30px 0 0}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
      background:var(--royal);cursor:pointer;border:4px solid #fff;box-shadow:0 2px 8px rgba(37,99,235,.4)}
    input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--royal);
      cursor:pointer;border:4px solid #fff;box-shadow:0 2px 8px rgba(37,99,235,.4)}
    .sl-ends{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px;
      color:var(--muted-2);font-weight:600}

    /* ── SEARCH ── */
    .search-wrap{position:relative;max-width:660px;margin:0 auto}
    .results{margin-top:8px;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;
      max-height:290px;overflow-y:auto}
    .res{display:flex;align-items:center;gap:13px;padding:13px 18px;cursor:pointer;border-bottom:1px solid var(--line-soft);
      font-size:15px;font-weight:600;transition:background .14s var(--ease)}
    .res:last-child{border-bottom:0}
    .res:hover{background:var(--royal-s)}
    .res img{width:28px;height:28px;border-radius:6px;object-fit:contain;flex:0 0 28px;background:#f1f5f9}
    .picked{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;justify-content:center}
    .pchip{display:flex;align-items:center;gap:9px;padding:9px 13px 9px 10px;background:var(--royal-s);
      border:1.5px solid var(--royal-light);border-radius:11px;font-size:14px;font-weight:700;color:var(--navy)}
    .pchip img{width:20px;height:20px;border-radius:4px;object-fit:contain}
    .pchip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:17px;line-height:1;padding:0 2px}
    .pchip button:hover{color:var(--err)}

    /* ── REPEATABLE BLOCKS ── */
    .blk{border:1.5px solid var(--line);border-radius:16px;padding:24px;margin-bottom:16px;background:#fdfeff}
    .blk-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .blk-n{font-family:'Fraunces',serif;font-size:17px;font-weight:700}
    .blk-x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;font-weight:700}
    .blk-x:hover{color:var(--err)}
    .fg{margin-bottom:16px}
    .add{width:100%;padding:15px;border:1.5px dashed var(--line);border-radius:13px;background:none;
      font-family:'Syne',sans-serif;font-size:14.5px;font-weight:700;color:var(--royal);cursor:pointer;
      transition:all .16s var(--ease)}
    .add:hover{border-color:var(--royal);background:var(--royal-s)}
    .add:disabled{opacity:.4;cursor:not-allowed}

    /* ── INTERSTITIAL ── */
    .inter-ic{width:64px;height:64px;border-radius:18px;background:var(--royal-s);display:grid;place-items:center;
      margin:0 auto 26px}
    .inter-ic svg{width:30px;height:30px;stroke:var(--royal);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .facts{display:flex;flex-direction:column;gap:14px;max-width:620px;margin:36px auto 0}
    .fact{display:flex;gap:14px;align-items:flex-start;padding:18px 20px;background:var(--royal-s);
      border-radius:14px;font-size:15px;font-weight:600;line-height:1.5;text-align:left}
    .fact svg{flex:0 0 21px;height:21px;stroke:var(--ok);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}

    /* ── FOOTER: Back and Continue are exactly the same size ── */
    .foot{position:sticky;bottom:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);
      border-top:1px solid var(--line-soft);padding:18px 24px;display:flex;justify-content:center;gap:16px}
    .btn{
      width:var(--btn-w); flex:0 0 var(--btn-w);       /* identical footprint */
      height:56px; border-radius:13px; cursor:pointer;
      font-family:'Syne',sans-serif; font-size:16px; font-weight:700; letter-spacing:.01em;
      display:inline-flex; align-items:center; justify-content:center;
      transition:background .18s var(--ease),border-color .18s var(--ease),transform .18s var(--ease),opacity .18s var(--ease);
    }
    .btn:active{transform:translateY(1px)}
    .btn-back{background:var(--white);border:1.5px solid var(--line);color:var(--muted)}
    .btn-back:hover:not(:disabled){border-color:var(--muted-2);color:var(--navy)}
    .btn-back:disabled{opacity:.42;cursor:not-allowed}
    .btn-next{background:var(--royal);border:1.5px solid var(--royal);color:#fff}
    .btn-next:hover{background:var(--royal-mid);border-color:var(--royal-mid)}

    .skip{display:block;margin:20px auto 0;border:0;background:none;font-family:'Syne',sans-serif;
      font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;text-decoration:underline;
      text-underline-offset:3px}
    .skip:hover{color:var(--royal)}

    .fine{margin-top:18px;font-size:12.5px;line-height:1.55;color:var(--muted);font-weight:500;text-align:center}
    .fine a{color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:2px}
    .fine a:hover{color:var(--royal)}

    .wc{margin-top:10px;font-size:13px;color:var(--muted);font-weight:600;text-align:right}
    .wc b{color:var(--navy)}

    @media(max-width:820px){
      .card{padding:38px 24px 42px;border-radius:18px}
      .stage{padding:26px 14px}
      .row{grid-template-columns:1fr}
      .foot{padding:14px 16px;gap:12px}
      .btn{flex:1 1 0;width:auto;min-width:0}   /* still equal to each other */
      h1.q{font-size:26px}
    }
  </style>
</head>

/* ═══════════════════════════════════════════════════════════════════
   AdmitMap funnel — one question per screen.

   Structure follows the Collegize onboarding pattern: a short
   motivation block first (cheap to answer, builds investment), a
   "why you fit" moment built from those answers, then the academic
   data the report actually needs.
   ═══════════════════════════════════════════════════════════════════ */

const MAX_SCHOOLS = 10, MAX_ACTS = 10;

const RANKS = ['Valedictorian','Salutatorian','Top 1%','Top 5%','Top 10%','Top 25%','Top 50%',
  'Bottom 50%','My school does not rank'];

const WHY = [
  'To open doors to the best career opportunities',
  'To explore my interests and challenge myself academically',
  'To network and surround myself with ambitious peers',
  'To maximise scholarships and graduate without debt'
];
const WORRY = [
  "My test scores or GPA aren't strong enough",
  "My extracurriculars don't feel impressive or unique",
  "I don't think my essays tell a powerful story",
  "I don't know what schools to apply to"
];
const CONFIDENCE = [
  'Extremely confident — I know my story is unique',
  "Somewhat confident — I think I'll stand out, but not sure",
  "Neutral — I'm just hoping for the best",
  'Not very confident — my profile feels average',
  "Not confident at all — I don't know what makes me stand out"
];

/* The "you're a fit" card reads back what they just told us. */
const WHY_FACT = {
  0:'Your report ranks every school by outcome, not prestige — so you can see which ones actually open the doors you want.',
  1:'You get admit-rate data by programme, because the odds for your major are rarely the odds the school advertises.',
  2:'You see the real admitted-student profile at each school — who gets in, not just how many.',
  3:'Every school on your list gets an estimated net price, so you can see where you graduate without debt.'
};
const WORRY_FACT = {
  0:'We show exactly how much your GPA and scores move your odds at each school — and where they matter least.',
  1:'Your activities get scored on depth, leadership and impact, so you can see what is actually carrying your profile.',
  2:'Your personal statement is graded on six dimensions with specific feedback, free with every report.',
  3:'Every school is sorted into Reach, Target and Likely against your real profile — no guessing.'
};

const GRAD_YEARS = (()=>{ const y=new Date().getFullYear(); return [y,y+1,y+2,y+3,y+4].map(String); })();
const SAT_RANGE = '400–1600', ACT_RANGE = '1–36';

const BLANK_ACT = () => ({type:'',desc:'',grades:[],hrs:'',weeks:''});
const BLANK_HON = () => ({title:'',grades:[],levels:[]});

const BLANK = {

  gradYear:'', state:'', major:'',
  gpa:'', rank:'', sat:'', act:'', apExams:[],

  wantsAid:null, income:'', householdSize:'', studentIncome:'', parentCash:'', parentInvest:'', budget:'',
  essayPrompt:null, essay:''
};

/* ── Screens. `req` returns an error string, or null when it can pass. ── */
const SCREENS = [

  {id:'income', type:'slider', field:'income', max:400000, step:2500, aid:true,

/* ═══ STATE ═══ */
let S = load(), i = 0, goingBack = false;

function load(){
  try{ const r = localStorage.getItem('admitmap_profile');
    if(r) return Object.assign(JSON.parse(JSON.stringify(BLANK)), JSON.parse(r)); }catch(e){}
  return JSON.parse(JSON.stringify(BLANK));
}
function save(){ try{ localStorage.setItem('admitmap_profile', JSON.stringify(S)); }catch(e){} }

const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const logo = d => 'https://img.logo.dev/'+encodeURIComponent(d)+'?token=pk_X-1ZO13GSgeOoUrIuJ6GMQ&size=128&format=png';
const words = t => t.trim() ? t.trim().split(/\s+/).length : 0;
const usd = n => '$'+(+n||0).toLocaleString('en-US');
const val = v => typeof v==='function' ? v() : v;

/* Financial screens disappear entirely when the student skipped the gate. */
const live = () => SCREENS.filter(s => !s.aid || S.wantsAid === true);

const TICK = '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';

/* ═══ RENDER ═══ */
function render(){
  const L = live(), sc = L[i];
  const card = document.getElementById('card');
  card.className = 'card' + (goingBack ? ' back' : '');
  goingBack = false;

  let h = '';
  if(sc.type !== 'fit'){
    h += `<h1 class="q">${val(sc.q)}</h1>`;
    if(sc.sub) h += `<p class="sub">${val(sc.sub)}</p>`;
  }
  h += `<div class="body">${VIEW[sc.type](sc)}</div>`;
  h += `<div class="err" id="err"></div>`;
  if(sc.opt) h += `<button class="skip" onclick="next(true)">Skip this — I'll add it later</button>`;
  card.innerHTML = h;

  document.getElementById('back').disabled = (i === 0);
  document.getElementById('next').textContent = (i === L.length-1) ? 'Build my report' : 'Continue';
  document.getElementById('pfill').style.width = Math.round(i/(L.length-1)*100) + '%';

  const f = card.querySelector('input:not([type=range]),textarea,select');
  if(f && window.innerWidth > 820) f.focus();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ═══ NAVIGATION ═══ */
function next(skip){
  const L = live(), sc = L[i];
  if(!skip && sc.req){
    const e = sc.req();
    if(e){ const el = document.getElementById('err'); el.textContent = e; el.classList.add('on'); return; }
  }
  save();
  if(i === L.length-1){ window.location.href = 'paywall.html'; return; }
  i++; render();
}
function prev(){ if(i === 0) return; goingBack = true; i--; render(); }

document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); next(); }
});

/* ═══ SHARED HELPERS ═══ */
function set(field, v){ S[field] = v; save(); }
function pick(field, idx){ S[field] = idx; save(); render(); }
function togg(arr, v){ const k = arr.indexOf(v); k<0 ? arr.push(v) : arr.splice(k,1); save(); render(); }
function optionList(opts, sel, ph){
  return `<option value="">${ph||'Select'}</option>` + val(opts).map(o =>
    `<option value="${esc(o)}"${o===sel?' selected':''}>${esc(o)}</option>`).join('');
}

      document.getElementById('slv').textContent='$'+(+this.value).toLocaleString('en-US')+(+this.value>=${sc.max}?'+':'')">
  <div class="sl-ends"><span>$0</span><span>${usd(sc.max)}+</span></div></div>`,

prompt: () => `<div class="choices" style="max-width:760px">${PROMPTS.map((p,k)=>
  `<button type="button" class="choice ${S.essayPrompt===k?'on':''}"
     style="align-items:flex-start;font-weight:500;line-height:1.5;font-size:14.5px"
     onclick="pick('essayPrompt',${k})"><span class="dot" style="margin-top:2px"></span>
     <span>${esc(p)}</span></button>`).join('')}</div>`,

essay: () => `<textarea class="fi" placeholder="Paste your essay here…"
  oninput="set('essay',this.value);document.getElementById('wc').innerHTML='<b>'+
    (this.value.trim()?this.value.trim().split(/\\s+/).length:0)+'</b> / 650 words'">${esc(S.essay)}</textarea>
  <div class="wc" id="wc"><b>${words(S.essay)}</b> / 650 words</div>`,


};

/* ═══ SCHOOL SEARCH ═══ */
function schChips(){
  return S.schools.map((s,k)=>`<span class="pchip">
    <img src="${logo(s.d)}" alt="" onerror="this.remove()">${esc(s.n)}
    <button onclick="S.schools.splice(${k},1);save();render()" aria-label="Remove">&times;</button></span>`).join('');
}
function searchSchools(q){
  const box = document.getElementById('results');
  q = q.trim().toLowerCase();
  if(q.length < 2){ box.innerHTML=''; return; }
  const alias = SCHOOL_ALIASES[q];                 // "mit" -> full name
  const taken = S.schools.map(s=>s.n);
  const hits = [];
  for(const u of universities){
    if(!u || !u.name || taken.indexOf(u.name)>-1) continue;
    const n = u.name.toLowerCase();
    if(n.indexOf(q)>-1 || (alias && u.name===alias)) hits.push(u);
    if(hits.length===7) break;
  }
  box.innerHTML = hits.length ? `<div class="results">${hits.map(u=>
    `<div class="res" onclick="addSchool(${JSON.stringify(u.name).replace(/"/g,'&quot;')},&quot;${u.domain}&quot;)">
      <img src="${logo(u.domain)}" alt="" onerror="this.style.visibility='hidden'">${esc(u.name)}</div>`).join('')}</div>` : '';
}
function addSchool(n, d){
  if(S.schools.length >= MAX_SCHOOLS) return;
  S.schools.push({n,d}); save();
  document.getElementById('sch').value=''; document.getElementById('results').innerHTML='';
  document.getElementById('picked').innerHTML = schChips();
  render();
}
function addAp(name){ if(!name) return; S.apExams.push({name,score:''}); save(); render(); }

render();
</script>
