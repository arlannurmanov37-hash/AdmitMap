<style>
*, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #dce7fa; color: #0f1f4b; font-variant-numeric: lining-nums tabular-nums; -webkit-text-size-adjust: 100%; }
  a { color: #2563eb; text-decoration: none; }
  a:hover { color: #1d4ed8; }
  @keyframes lpShim { 0% { transform: translateY(-60%) } 100% { transform: translateY(560%) } }
  @keyframes lpGrow { 0% { transform: scaleY(.14) } 100% { transform: scaleY(1) } }
  @keyframes lpSpin { 0% { transform: rotate(0) } 100% { transform: rotate(360deg) } }
  @keyframes lpBlink { 0%, 100% { opacity: .32 } 50% { opacity: 1 } }
  @keyframes lpSweep3 { 0% { stroke-dashoffset: 427 } 100% { stroke-dashoffset: 73 } }
</style>
</head>
<body>
<div data-screen-label="Loading" style="position:relative;overflow:hidden;display:flex;flex-direction:column;width:402px;max-width:100%;height:874px;margin:0 auto;background:linear-gradient(178deg,#ffffff 0%,#f4f8ff 40%,#e6effd 100%);border-left:1px solid #e6ecf6;border-right:1px solid #e6ecf6;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-.008em;-webkit-font-smoothing:antialiased;text-wrap:pretty">

  <span style="position:absolute;top:-240px;left:50%;transform:translateX(-50%);width:700px;height:500px;border-radius:50%;background:radial-gradient(50% 50% at 50% 50%,rgba(96,165,250,.26),rgba(230,239,253,0) 70%);pointer-events:none"></span>

  <div style="position:relative;flex:none;display:flex;flex-direction:column;gap:20px;padding:26px 22px 22px">

    <div style="display:flex;align-items:center;justify-content:space-between;gap:14px">
      <span style="display:flex;align-items:center;gap:8px;font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:900;letter-spacing:-.032em;color:#101d42">
        <img src="admitmap-mark.svg" alt="" style="width:19px;height:19px;flex-shrink:0;object-fit:contain"><span>Admit<span style="color:#2563eb">Map</span></span>
      </span>
      <span style="display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:12px;font-weight:700;color:#43536b"><span style="width:6px;height:6px;border-radius:50%;background:#2563eb;animation:lpBlink 1.4s ease-in-out infinite"></span>Almost there</span>
    </div>

    <div style="display:flex;align-items:center;gap:20px">
      <span style="position:relative;display:flex;align-items:center;justify-content:center;width:152px;height:152px;flex-shrink:0">
        <svg width="152" height="152" viewBox="0 0 152 152" style="position:absolute;inset:0;transform:rotate(-90deg)">
          <circle cx="76" cy="76" r="68" fill="none" stroke="#e6edf8" stroke-width="9"></circle>
          <circle cx="76" cy="76" r="68" fill="none" stroke="#3b82f6" stroke-width="9" stroke-linecap="round" stroke-dasharray="427" style="animation:lpSweep3 2.8s cubic-bezier(.4,0,.2,1) both"></circle>
        </svg>
        <span style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px">
          <span style="display:flex;align-items:baseline;gap:1px"><span style="font-family:Fraunces,Georgia,serif;font-size:46px;font-weight:900;line-height:.88;color:#0f1f4b">83</span><span style="font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:900;color:#5f7292">%</span></span>
          <span style="font-size:8.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#5f7292">Analysing</span>
        </span>
      </span>
      <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
        <h1 style="margin:0;font-family:Fraunces,Georgia,serif;font-size:29px;font-weight:900;line-height:1.02;letter-spacing:-.04em;color:#0f1f4b">Building your report.</h1>
        <span style="display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:800;color:#1d4ed8"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" style="flex-shrink:0;animation:lpSpin 1.1s linear infinite"><path d="M12 3.5a8.5 8.5 0 1 1-8.5 8.5"></path></svg>Modelling financial aid</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px;padding-top:18px;border-top:1px solid #dbe7f7">
      <span style="display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;color:#43536b" data-ldstep><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0b8f5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M4.5 12.5l5 5L20 6.5"></path></svg>Academic profile read</span>
      <span style="display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;color:#43536b" data-ldstep><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0b8f5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M4.5 12.5l5 5L20 6.5"></path></svg>Activities and honors scored</span>
      <span style="display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;color:#43536b" data-ldstep><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0b8f5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M4.5 12.5l5 5L20 6.5"></path></svg>Compared against admitted students</span>
      <span style="display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:600;color:#43536b" data-ldstep><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0b8f5c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M4.5 12.5l5 5L20 6.5"></path></svg>Essay graded on six criteria</span>
      <span style="display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:800;color:#0f1f4b" data-ldstep><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" style="flex-shrink:0;animation:lpSpin 1.1s linear infinite"><path d="M12 3.5a8.5 8.5 0 1 1-8.5 8.5"></path></svg>Modelling financial aid</span>
      <span style="display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:500;color:#5f7292" data-ldstep><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#a9b6cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M4.5 12.5l5 5L20 6.5"></path></svg>Writing your roadmap</span>
    </div>
  </div>

  <div style="position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;margin:0 16px;padding:20px 18px 22px;border-radius:20px 20px 0 0;background:#ffffff;border:1px solid #cfdff5;border-bottom:0;box-shadow:0 -1px 0 rgba(255,255,255,.9) inset,0 -18px 44px -20px rgba(23,62,140,.22)">
    <span style="position:absolute;left:0;right:0;height:130px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(96,165,250,.14),rgba(255,255,255,0));animation:lpShim 3s ease-in-out infinite;pointer-events:none"></span>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:2px">
      <span style="display:block;width:142px;height:17px;border-radius:6px;background:#e0eaf9"></span>
      <span style="display:block;width:64px;height:11px;border-radius:5px;background:#eef2f9"></span>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      <span style="display:flex;flex-direction:column;gap:7px;padding:11px;border-radius:12px;background:#fbfcff;border:1px solid #e8eef8"><span style="width:34px;height:7px;border-radius:4px;background:#eef2f9"></span><span style="width:74%;height:16px;border-radius:5px;background:#dbe7f9"></span></span>
      <span style="display:flex;flex-direction:column;gap:7px;padding:11px;border-radius:12px;background:#fbfcff;border:1px solid #e8eef8"><span style="width:34px;height:7px;border-radius:4px;background:#eef2f9"></span><span style="width:58%;height:16px;border-radius:5px;background:#dbe7f9"></span></span>
      <span style="display:flex;flex-direction:column;gap:7px;padding:11px;border-radius:12px;background:#fbfcff;border:1px solid #e8eef8"><span style="width:34px;height:7px;border-radius:4px;background:#eef2f9"></span><span style="width:80%;height:16px;border-radius:5px;background:#dbe7f9"></span></span>
    </div>

    <div style="display:flex;align-items:flex-end;gap:8px;height:116px;flex-shrink:0;padding:14px 13px 12px;border-radius:14px;background:#fbfcff;border:1px solid #e8eef8">
      <span style="flex:1;height:36%;border-radius:5px 5px 0 0;background:#dbe7f9;transform-origin:bottom;animation:lpGrow 2s cubic-bezier(.23,1,.32,1) infinite alternate"></span>
      <span style="flex:1;height:60%;border-radius:5px 5px 0 0;background:#9dc0f7;transform-origin:bottom;animation:lpGrow 2s cubic-bezier(.23,1,.32,1) .1s infinite alternate"></span>
      <span style="flex:1;height:46%;border-radius:5px 5px 0 0;background:#dbe7f9;transform-origin:bottom;animation:lpGrow 2s cubic-bezier(.23,1,.32,1) .2s infinite alternate"></span>
      <span style="flex:1;height:82%;border-radius:5px 5px 0 0;background:#4c86f0;transform-origin:bottom;animation:lpGrow 2s cubic-bezier(.23,1,.32,1) .3s infinite alternate"></span>
      <span style="flex:1;height:54%;border-radius:5px 5px 0 0;background:#dbe7f9;transform-origin:bottom;animation:lpGrow 2s cubic-bezier(.23,1,.32,1) .4s infinite alternate"></span>
      <span style="flex:1;height:70%;border-radius:5px 5px 0 0;background:#9dc0f7;transform-origin:bottom;animation:lpGrow 2s cubic-bezier(.23,1,.32,1) .5s infinite alternate"></span>
      <span style="flex:1;height:42%;border-radius:5px 5px 0 0;background:#dbe7f9;transform-origin:bottom;animation:lpGrow 2s cubic-bezier(.23,1,.32,1) .6s infinite alternate"></span>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;background:#fbfcff;border:1px solid #e8eef8"><span style="width:22px;height:22px;border-radius:7px;background:#eef2f9"></span><span style="flex:1;height:9px;border-radius:5px;background:#eef2f9"></span><span style="width:36px;height:14px;border-radius:5px;background:#dbe7f9"></span></span>
      <span style="display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;background:#fbfcff;border:1px solid #e8eef8;opacity:.6"><span style="width:22px;height:22px;border-radius:7px;background:#eef2f9"></span><span style="flex:1;height:9px;border-radius:5px;background:#eef2f9"></span><span style="width:36px;height:14px;border-radius:5px;background:#eef2f9"></span></span>
      <span style="display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;background:#fbfcff;border:1px solid #e8eef8;opacity:.35"><span style="width:22px;height:22px;border-radius:7px;background:#eef2f9"></span><span style="flex:1;height:9px;border-radius:5px;background:#eef2f9"></span><span style="width:36px;height:14px;border-radius:5px;background:#eef2f9"></span></span>
    </div>
  </div>

  
</div>
<script>
/* Шаги проигрываются по очереди: сначала все ждут, потом гаснут по одному
   в зелёную галочку. Дойдя до конца — уходим на signup.html, как и раньше. */
(function () {
  var steps = [].slice.call(document.querySelectorAll('[data-ldstep]'));
  var STEP_MS = 620, TAIL_MS = 700;

  steps.forEach(function (el) { el.style.opacity = '.38'; });

  var i = 0;
  (function tick() {
    if (i < steps.length) {
      steps[i].style.transition = 'opacity .3s ease';
      steps[i].style.opacity = '1';
      i++;
      setTimeout(tick, STEP_MS);
      return;
    }
    setTimeout(function () { window.location.href = 'signup.html'; }, TAIL_MS);
  })();
})();
</script>
</body>
</html>
