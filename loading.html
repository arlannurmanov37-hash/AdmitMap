<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building your report · AdmitMap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* design reference 1600 x 1012 — 1rem = 16px there */
html{font-size:min(1vw, 1.581vh)}
:root{
  --navy:#0f1f4b; --ink:#101d42;
  --royal:#2563eb; --royal-d:#1d4ed8; --royal-l:#dbeafe; --royal-s:#eef4ff;
  --muted-1:#5b7098; --muted-2:#7d8ba6; --muted-3:#8296b5; --muted-4:#a9b6cc;
  --line:#e6ebf4; --line-2:#eef1f7; --lip:#f1f4fa;
  --green:#10b981; --green-d:#059669; --green-l:#d9f5e9;
  --purple:#7c3aed; --purple-l:#ede9fe;
  --amber:#f59e0b; --amber-l:#fef3c7; --amber-d:#b45309;
  --ease:cubic-bezier(.23,1,.32,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--navy);background:#fbfcfe;letter-spacing:-.008em;-webkit-font-smoothing:antialiased;
  font-variant-numeric:lining-nums tabular-nums;text-wrap:pretty}
button{font-family:inherit;cursor:pointer}
@keyframes up{from{opacity:0;transform:translateY(.75rem)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.u{animation:up .55s var(--ease) both}.f{animation:fade .6s ease-out both}
.d1{animation-delay:.06s}.d2{animation-delay:.13s}.d3{animation-delay:.2s}.d4{animation-delay:.27s}
.d5{animation-delay:.34s}.d6{animation-delay:.41s}.d7{animation-delay:.48s}
@media(prefers-reduced-motion:reduce){.u,.f{animation:none!important}}

.screen{display:none;flex-direction:column;align-items:center;justify-content:center;
  position:relative;height:100vh;height:100dvh;overflow:hidden;padding:2rem 3rem;text-align:center}
.screen.on{display:flex}
.glow{position:absolute;top:-14rem;left:50%;transform:translateX(-50%);width:56rem;height:38rem;
  pointer-events:none}
.glow.amber{background:radial-gradient(50% 50% at 50% 50%,rgba(245,158,11,.15),transparent 70%)}
.glow.blue{background:radial-gradient(50% 50% at 50% 50%,rgba(37,99,235,.13),transparent 70%)}
.in{position:relative;z-index:1;width:100%;max-width:74rem;display:flex;flex-direction:column;align-items:center}

.brand{display:inline-flex;align-items:center;gap:.75rem;margin-bottom:1.75rem}
.brand svg{width:2.5rem;height:2.5rem}
.brand-t{font-family:Fraunces,Georgia,serif;font-size:2.25rem;font-weight:900;
  letter-spacing:-.045em;color:var(--ink)}
.brand-t span{color:var(--royal)}

h1{font-family:Fraunces,Georgia,serif;font-size:3.25rem;font-weight:900;letter-spacing:-.048em;
  line-height:1.05;margin:0 0 .875rem;max-width:26ch}
h1 em{font-style:normal;color:var(--royal)}
.sub{font-size:1.0625rem;line-height:1.6;color:var(--muted-1);margin:0 0 2rem;max-width:70ch}

/* proof */
.rate{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-bottom:1.5rem}
.stars{display:flex;gap:.375rem;color:var(--amber)}
.stars svg{width:2rem;height:2rem;display:block}
.rate-n{display:flex;align-items:baseline;gap:.375rem}
.rate-n b{font-family:Fraunces,Georgia,serif;font-size:3.5rem;font-weight:900;letter-spacing:-.05em;line-height:1}
.rate-n i{font-family:Fraunces,Georgia,serif;font-size:1.5rem;font-weight:700;font-style:normal;color:var(--muted-4)}
.rate-d{width:1px;height:2.25rem;background:var(--line)}
.rate-t{font-size:1.0625rem;font-weight:700;color:var(--muted-1)}

.logos{display:flex;align-items:center;justify-content:center;gap:.625rem;flex-wrap:wrap;margin-bottom:2.25rem}
.logos span{display:flex;align-items:center;justify-content:center;width:4.375rem;height:4.375rem;
  border-radius:1.25rem;background:#fff;box-shadow:0 0 0 1px rgba(15,31,75,.07),0 .25rem .625rem rgba(15,31,75,.11)}
.logos img{width:2.875rem;height:2.875rem;object-fit:contain}

.prow{display:grid;grid-template-columns:1fr 1fr 2.1fr;gap:1.25rem;width:100%;margin-bottom:2.25rem}
.pstat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;
  padding:2.75rem 1.25rem;border-radius:1.25rem;background:#fff;border:1.5px solid var(--line);
  box-shadow:0 3px 0 var(--lip)}
.pstat svg{width:1.5rem;height:1.5rem}
.pstat b{font-family:Fraunces,Georgia,serif;font-size:2.625rem;font-weight:900;letter-spacing:-.045em;line-height:1}
.pstat i{font-size:.875rem;font-weight:700;font-style:normal;color:var(--muted-3)}
.quote{display:flex;align-items:center;gap:1.375rem;padding:1.75rem 1.875rem;border-radius:1.25rem;
  background:#fff;border:1.5px solid var(--line);box-shadow:0 3px 0 var(--lip),0 .75rem 1.625rem rgba(15,31,75,.07);
  text-align:left}
.q-lg{position:relative;display:flex;align-items:center;justify-content:center;width:3.625rem;height:3.625rem;
  flex-shrink:0;border-radius:1.0625rem;background:#fff;
  box-shadow:0 0 0 1px rgba(15,31,75,.07),0 3px .5625rem rgba(15,31,75,.12)}
.q-lg img{width:2.375rem;height:2.375rem;object-fit:contain}
.q-b{position:absolute;right:-.375rem;bottom:-.375rem;display:flex;align-items:center;justify-content:center;
  width:1.5rem;height:1.5rem;border-radius:50%;background:var(--green);border:3px solid #fff}
.q-b svg{width:.75rem;height:.75rem}
.q-t q{display:block;font-family:Fraunces,Georgia,serif;font-size:1.1875rem;font-weight:700;
  line-height:1.5;letter-spacing:-.02em;margin-bottom:.625rem;quotes:'“' '”'}
.q-m{display:flex;align-items:center;gap:.625rem;flex-wrap:wrap}
.q-m b{font-size:.8125rem;font-weight:800}
.tag{display:inline-flex;align-items:center;padding:.1875rem .5625rem;border-radius:.375rem;
  background:rgba(16,185,129,.13);font-size:.65625rem;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;color:var(--green-d)}
.q-m i{font-size:.8125rem;font-weight:600;font-style:normal;color:var(--muted-3)}

/* found */
.pill{display:inline-flex;align-items:center;gap:.5rem;padding:.375rem .875rem .375rem .4375rem;
  border-radius:1.25rem;background:rgba(16,185,129,.11);margin-bottom:1.25rem}
.pill i{display:flex;align-items:center;justify-content:center;width:1.125rem;height:1.125rem;
  border-radius:50%;background:var(--green)}
.pill i svg{width:.625rem;height:.625rem}
.pill span{font-size:.6875rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green-d)}

.strip{display:flex;align-items:center;justify-content:center;gap:1.125rem;width:100%;
  padding:.9375rem 1.875rem;border-radius:1.375rem;margin-bottom:1.25rem;
  background:linear-gradient(120deg,#eef4ff,#f7faff 60%,#fff);border:1px solid #d7e4fb;
  box-shadow:0 1px 2px rgba(15,31,75,.05),0 .5rem 1.25rem rgba(37,99,235,.07)}
.strip .logos{margin:0;gap:.5rem;flex-wrap:nowrap}
.strip .logos span{width:3.5rem;height:3.5rem;border-radius:1rem}
.strip .logos img{width:2.25rem;height:2.25rem}
.strip-d{width:1px;height:1.875rem;background:#dbe6f8;flex-shrink:0}
.strip-t{display:flex;align-items:center;gap:.6875rem;white-space:nowrap}
.strip-t b{font-size:.9375rem;font-weight:800}
.strip-t i{width:.25rem;height:.25rem;border-radius:50%;background:#b7c8e4;display:block}
.strip-t span{font-size:.9375rem;font-weight:600;color:#7d93b8}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.125rem;width:100%;padding:1rem;
  border-radius:1.625rem;background:linear-gradient(170deg,#eef4ff,#e8f0fb 60%,#f4f8ff);
  border:1px solid #dee8f8;margin-bottom:1.125rem}
.stat{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:2rem 1.375rem 1.75rem;
  border-radius:1.25rem;background:linear-gradient(165deg,#fff,#f3f8ff);border:1px solid #dbe6fa;
  box-shadow:0 3px 0 rgba(37,99,235,.07),0 .625rem 1.375rem rgba(15,31,75,.05)}
.stat-i{display:flex;align-items:center;justify-content:center;width:2.875rem;height:2.875rem;border-radius:.9375rem}
.stat-i svg{width:1.4375rem;height:1.4375rem}
.stat-n{display:flex;align-items:baseline;font-family:Fraunces,Georgia,serif;font-weight:900;
  font-size:2.75rem;line-height:1;letter-spacing:-.05em}
.stat-n small{font-size:1.25rem;font-weight:700;color:var(--muted-4)}
.stat-t{font-size:.9375rem;font-weight:800;line-height:1.3}
.stat-s{font-size:.78125rem;font-weight:600;line-height:1.35;color:var(--muted-3)}

.locked{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:1.125rem;
  padding:1.125rem 1.75rem;border-radius:1.125rem;margin-bottom:1.5rem;
  background:linear-gradient(110deg,#f7f9fd,#f2f5fb 52%,#f8fafd);border:1px solid #e3e9f3;
  box-shadow:inset 0 1px 0 #fff}
.locked::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(135deg,rgba(15,31,75,.022) 0 1px,transparent 1px .5625rem)}
.locked-i{position:relative;display:flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;
  flex-shrink:0;border-radius:.875rem;background:#fff;color:#64748b;
  box-shadow:0 0 0 1px rgba(15,31,75,.06),0 2px .375rem rgba(15,31,75,.08)}
.locked-i svg{width:1.25rem;height:1.25rem}
.locked-t{position:relative;text-align:left}
.locked-t b{display:block;font-size:.625rem;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted-4);margin-bottom:.1875rem}
.locked-t span{font-size:.9375rem;font-weight:700;color:#475569}
.locked-d{position:relative;width:1px;height:1.875rem;background:var(--line);flex-shrink:0}
.locked-n{position:relative;font-size:.8125rem;font-weight:700;color:var(--muted-3);white-space:nowrap}

.cta{display:inline-flex;align-items:center;justify-content:center;gap:.75rem;border:0;
  height:4rem;padding:0 2.5rem;border-radius:1rem;
  background:linear-gradient(180deg,#4581f7,#2f6ef0 42%,#2461e4);color:#fff;
  font-size:1.0625rem;font-weight:800;letter-spacing:-.01em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 0 #2359d6,0 2px 0 #2156ce,0 3px 0 #1e51c4,
    0 4px 0 #1c4cba,0 5px 0 #1a47b0,0 6px 1px rgba(12,38,110,.5),
    0 .6875rem 1.25rem rgba(15,31,75,.22),0 1.25rem 2.125rem rgba(37,99,235,.22);
  transition:transform .14s var(--ease),box-shadow .14s ease}
.cta:hover{transform:translateY(5px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 #2359d6,0 2px 1px rgba(12,38,110,.45),
    0 .375rem .75rem rgba(15,31,75,.2),0 .6875rem 1.25rem rgba(37,99,235,.2)}
.cta svg{width:1.125rem;height:1.125rem}

@media(max-width:1100px){
  html{font-size:min(2.4vw,1.581vh)}
  html,body{overflow:auto}
  .screen{height:auto;min-height:100vh;padding:2rem 1.25rem 3rem}
  .prow{grid-template-columns:1fr;gap:.875rem}
  .stats{grid-template-columns:1fr 1fr}
  .strip{flex-direction:column}
  .strip .logos{flex-wrap:wrap}
  .strip-d{display:none}
}

/* ── loading / analysis ── */
.ld{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:44rem}
.ring-wrap{position:relative;width:12.5rem;height:12.5rem;margin:.5rem 0 2rem}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-p{font-family:Fraunces,Georgia,serif;font-size:3rem;font-weight:900;letter-spacing:-.05em;line-height:1}
.ring-l{font-size:.6875rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted-3);margin-top:.375rem}
.ld-steps{display:flex;flex-direction:column;gap:.5rem;width:100%;text-align:left}
.ld-s{display:flex;align-items:center;gap:.875rem;padding:.875rem 1.125rem;border-radius:.9375rem;
  background:#fff;border:1.5px solid var(--line);box-shadow:0 2px 0 var(--lip);
  font-size:.9375rem;font-weight:700;color:var(--muted-3);
  opacity:.5;transition:opacity .3s var(--ease),color .3s ease,border-color .3s ease}
.ld-s.act{opacity:1;color:var(--navy);border-color:#cbdcf8}
.ld-s.done{opacity:1;color:var(--navy)}
.ld-d{display:flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem;flex-shrink:0;
  border-radius:50%;background:var(--line-2);color:var(--muted-4)}
.ld-s.act .ld-d{background:var(--royal-l);color:var(--royal)}
.ld-s.done .ld-d{background:var(--green);color:#fff}
.ld-d svg{width:.8125rem;height:.8125rem}
.ld-spin{width:.75rem;height:.75rem;border:2px solid var(--royal);border-right-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#ld-sub{transition:opacity .18s var(--ease)}
.ld-note{font-size:.8125rem;color:var(--muted-3);font-weight:600;margin-top:1.5rem}

/* ══════ LOADING SCREEN ══════ */
#s-load{background:#e9eefa;display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem}
.ldc{width:100%;max-width:62rem;background:linear-gradient(150deg,#fbfcff 0%,#f4f8ff 42%,#eef4ff 100%);
  border-radius:1.75rem;padding:2.25rem 2.5rem 0;box-shadow:0 24px 70px -20px rgba(15,31,75,.22);
  overflow:hidden;animation:ldIn .5s var(--ease) both}
@keyframes ldIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* Логотип по центру страницы; статус остаётся справа, поэтому он
   выведен из потока — иначе он сдвигал бы логотип с центра. */
/* Три колонки: пустая — логотип — статус. Логотип держит центр страницы,
   статус прижат вправо, а высота строки задаётся логотипом, поэтому
   статус встаёт ровно на уровень надписи. */
/* Вертикальный центр статуса совпадает с вертикальным центром логотипа. */
.ldc-top{display:flex;align-items:center}
.ldc-spacer{flex:1 1 0}
.ldc-top .brand{flex:0 0 auto;align-items:center}
.ldc-top .brand-mark{width:4rem;height:4rem}
.ldc-top .brand-t{font-size:3.5rem;line-height:1;display:block}
.ldc-top .brand{gap:1rem;line-height:1;margin:0}
.ldc-status{flex:1 1 0;justify-content:flex-end;align-items:center}
.ldc-status{display:inline-flex;align-items:center;gap:.6875rem;font-size:1.25rem;font-weight:800;
  letter-spacing:-.015em;color:var(--ink)}
.ldc-status i{width:.6875rem;height:.6875rem;border-radius:50%;background:var(--royal);flex-shrink:0;
  animation:pulseDot 1.5s ease-in-out infinite}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}

.ldc-head{display:flex;align-items:center;justify-content:center;gap:2.75rem;margin:1.75rem 0 0}
.ldc .ring-wrap{position:relative;width:13rem;height:13rem;flex-shrink:0}
.ldc .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
/* Таймер тикает раз в 60 мс — переход сглаживает шаг до плавной дуги */
#ring{transition:stroke-dashoffset .14s linear}
.ldc .ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ldc .ring-p{display:flex;align-items:baseline;justify-content:center;gap:.0625rem;
  font-family:Fraunces,Georgia,serif;color:var(--ink);line-height:1}
.ldc .ring-p b{font-size:4rem;font-weight:900;letter-spacing:-.05em;
  transition:font-size .2s var(--ease)}
.ldc .ring-p i{font-size:1.6875rem;font-weight:900;font-style:normal;letter-spacing:-.03em;
  transition:font-size .2s var(--ease)}
/* Три цифры шире двух — на 100% ужимаем, иначе упирается в кольцо */
.ldc .ring-p.full b{font-size:3.125rem}
.ldc .ring-p.full i{font-size:1.3125rem}
.ldc .ring-l{font-size:.8125rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted-3);margin-top:.25rem}
.ldc-ht{min-width:0}
.ldc-ht h1{font-family:Fraunces,Georgia,serif;font-size:2.75rem;font-weight:900;letter-spacing:-.045em;
  line-height:1.04;color:var(--ink);margin:0}
.ldc-now{display:flex;align-items:center;gap:.625rem;margin:.75rem 0 0;font-size:1.125rem;font-weight:700;
  color:var(--royal);transition:opacity .18s var(--ease),color .3s ease}
.ldc-now.done{color:#15803d}
.ldc-now.done .ldc-nowi svg{stroke:#15803d;fill:none;stroke-width:3.1;
  stroke-linecap:square;stroke-linejoin:miter}
.ldc-nowi{display:flex;align-items:center;justify-content:center;width:1.25rem;height:1.25rem;flex-shrink:0}
.ldc-nowi svg{width:1.25rem;height:1.25rem}
.ldc-now .ld-spin{width:1rem;height:1rem;border-width:2.5px;flex-shrink:0}

.ldc-rule{height:1px;background:#dbe4f4;margin:1.75rem 0 1.5rem}

/* Чеклист в две колонки: выполненное прошедшим временем, активное настоящим */
 /* Страница делится пополам; внутри каждой половины блок пунктов
    центрируется, а сами пункты выровнены по левому краю — так галочки
    стоят в одну колонку, а не «лесенкой». */
.ldc-steps{display:grid;grid-template-columns:1fr 1fr}
.ldc-col{display:flex;flex-direction:column;gap:.875rem;width:fit-content;margin:0 auto}
.ldc-s{display:flex;align-items:flex-start;gap:1.125rem;font-size:1.0625rem;font-weight:600;
  color:var(--muted-3);transition:color .3s ease}
.ldc-s.done{color:var(--ink)}
.ldc-s.act{color:var(--ink);font-weight:800}
.ldc-i{flex-shrink:0;width:1.75rem;height:1.75rem;display:flex;align-items:center;justify-content:center;
  margin-top:-.0625rem}
.ldc-i svg{width:1.75rem;height:1.75rem;stroke:#15803d;fill:none;stroke-width:3.1;
  stroke-linecap:square;stroke-linejoin:miter}

/* Ещё не начатый шаг — серый заполненный кружок, который пульсирует:
   радиус растёт и снова уменьшается. */
.ld-pulse{width:1.125rem;height:1.125rem;border-radius:50%;background:#c3cedd;
  animation:beat 1.5s ease-in-out infinite}
@keyframes beat{
  0%,100%{transform:scale(.78);opacity:.55}
  50%    {transform:scale(1.12);opacity:1}
}
.ldc-i .ld-spin{width:1.3125rem;height:1.3125rem;border-width:2.75px}

/* ── Скелет отчёта ── */
.sk{width:100%;max-width:44rem;margin:1.75rem auto 0;background:#fff;
  border-radius:1.25rem 1.25rem 0 0;padding:1.5rem 1.5rem 0;
  box-shadow:0 -1px 0 #e8eefb inset}
.sk-b{display:block;height:.875rem;border-radius:.4375rem;background:#e3ebf9}
.sk-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.125rem}
.sk-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1rem}
.sk-t{border:1px solid #e8eefb;border-radius:.75rem;padding:.75rem;display:flex;flex-direction:column;gap:.5rem}
.sk-b.tall{height:1.375rem;background:#d3e0fa}
.sk-chart{display:flex;align-items:flex-end;gap:.625rem;height:8rem;border:1px solid #e8eefb;
  border-radius:.75rem;padding:.875rem;margin-bottom:.875rem}
.sk-chart i{flex:1;border-radius:.3125rem .3125rem 0 0;background:#e3ebf9;height:var(--h)}
.sk-chart i.mid{background:#b9d0f8}
.sk-chart i.on{background:var(--royal)}
.sk-line{display:flex;align-items:center;gap:.875rem;border:1px solid #e8eefb;border-radius:.75rem;
  padding:.8125rem .875rem;margin-bottom:.625rem}
.sk-dot{width:1.375rem;height:1.375rem;border-radius:.4375rem;background:#e3ebf9;flex-shrink:0}
.sk-b.grow{flex:1}
.w8{width:2.75rem}.w14{width:5rem}.w32{width:11rem}.w38{width:38%}.w40{width:40%}
.w46{width:46%}.w52{width:52%}.w54{width:54%}.w58{width:58%}.w66{width:66%}.w70{width:70%}

/* Скелет отчёта живой: по нему идёт блик, столбцы поднимаются, строки
   проявляются по очереди — видно, что отчёт прямо сейчас собирается. */
.sk{position:relative;overflow:hidden}
.sk::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);
  transform:translateX(-100%);animation:skSweep 2.4s ease-in-out infinite}
@keyframes skSweep{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}

.sk-b{animation:skBreathe 2.4s ease-in-out infinite}
.sk-t:nth-child(2) .sk-b{animation-delay:.12s}
.sk-t:nth-child(3) .sk-b{animation-delay:.24s}
.sk-t:nth-child(4) .sk-b{animation-delay:.36s}
@keyframes skBreathe{0%,100%{opacity:1}50%{opacity:.55}}

.sk-chart i{animation:skGrow 3.2s cubic-bezier(.4,0,.2,1) infinite;transform-origin:bottom}
.sk-chart i:nth-child(1){animation-delay:0s}    .sk-chart i:nth-child(2){animation-delay:.1s}
.sk-chart i:nth-child(3){animation-delay:.2s}   .sk-chart i:nth-child(4){animation-delay:.3s}
.sk-chart i:nth-child(5){animation-delay:.4s}   .sk-chart i:nth-child(6){animation-delay:.5s}
.sk-chart i:nth-child(7){animation-delay:.6s}   .sk-chart i:nth-child(8){animation-delay:.7s}
@keyframes skGrow{
  0%{transform:scaleY(.34)}
  32%{transform:scaleY(1)}
  58%{transform:scaleY(.82)}
  80%{transform:scaleY(.94)}
  100%{transform:scaleY(.34)}}

.sk-line{animation:skLine 3.2s ease-in-out infinite}
.sk-line:nth-of-type(2){animation-delay:.35s}
.sk-line:nth-of-type(3){animation-delay:.7s}
@keyframes skLine{0%,10%{opacity:.25}35%,70%{opacity:1}100%{opacity:.25}}

.sk-dot{animation:skDot 3.2s ease-in-out infinite}
.sk-line:nth-of-type(2) .sk-dot{animation-delay:.35s}
.sk-line:nth-of-type(3) .sk-dot{animation-delay:.7s}
@keyframes skDot{0%,15%{background:#e3ebf9}40%,75%{background:var(--royal)}100%{background:#e3ebf9}}

@media(prefers-reduced-motion:reduce){
  .sk::after,.sk-b,.sk-chart i,.sk-line,.sk-dot{animation:none!important}
  .sk-line{opacity:1}
}

@media(max-width:900px){
  .ldc{padding:1.5rem 1.25rem 0;border-radius:1.25rem}
  .ldc-head{flex-direction:column;align-items:flex-start;gap:1.25rem}
  .ldc .ring-wrap{width:8rem;height:8rem}
  .ldc .ring-p{font-size:2.5rem}
  .ldc-ht h1{font-size:2rem}
  .ldc-steps{grid-template-columns:1fr;gap:.875rem}
  .sk-tiles{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<!-- ══════ 00 · LOADING ══════ -->
<section class="screen on" id="s-load">
  <div class="ldc">

    <div class="ldc-top">
      <span class="ldc-spacer" aria-hidden="true"></span>
      <span class="brand">
        <img src="admitmap-mark.svg" alt="" class="brand-mark">
        <span class="brand-t">Admit<span>Map</span></span>
      </span>
      <span class="ldc-status"><i></i><span id="ld-status">Getting started</span></span>
    </div>

    <div class="ldc-head">
      <div class="ring-wrap">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="88" fill="none" stroke="#e4ecf8" stroke-width="14"/>
          <circle id="ring" cx="100" cy="100" r="88" fill="none" stroke="#2563eb" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="552.9" stroke-dashoffset="552.9"/>
        </svg>
        <span class="ring-c"><span class="ring-p" id="ring-p"><b id="ring-n">0</b><i>%</i></span><span class="ring-l" id="ring-l">Analyzing</span></span>
      </div>
      <div class="ldc-ht">
        <h1>Building your report.</h1>
        <p class="ldc-now"><span class="ldc-nowi" id="ld-nowi"><span class="ld-spin"></span></span><span id="ld-now">Reading your academic profile</span></p>
      </div>
    </div>

    <div class="ldc-rule"></div>

    <div class="ldc-steps" id="ld-steps"></div>

    <!-- Скелет отчёта: показывает форму того, что сейчас собирается -->
    <div class="sk" aria-hidden="true">
      <div class="sk-row"><span class="sk-b w32"></span><span class="sk-b w14"></span></div>
      <div class="sk-tiles">
        <div class="sk-t"><span class="sk-b w40"></span><span class="sk-b w66 tall"></span></div>
        <div class="sk-t"><span class="sk-b w52"></span><span class="sk-b w58 tall"></span></div>
        <div class="sk-t"><span class="sk-b w46"></span><span class="sk-b w70 tall"></span></div>
        <div class="sk-t"><span class="sk-b w38"></span><span class="sk-b w54 tall"></span></div>
      </div>
      <div class="sk-chart">
        <i style="--h:34%"></i><i style="--h:70%" class="mid"></i><i style="--h:40%"></i>
        <i style="--h:62%" class="on"></i><i style="--h:22%"></i><i style="--h:30%" class="mid"></i>
        <i style="--h:28%"></i><i style="--h:56%"></i>
      </div>
      <div class="sk-line"><span class="sk-dot"></span><span class="sk-b grow"></span><span class="sk-b w8"></span></div>
      <div class="sk-line"><span class="sk-dot"></span><span class="sk-b grow"></span><span class="sk-b w8"></span></div>
      <div class="sk-line"><span class="sk-dot"></span><span class="sk-b grow"></span><span class="sk-b w8"></span></div>
    </div>

  </div>
</section>


<script>
/* [строка под заголовком, пункт чеклиста пока идёт, пункт чеклиста когда сделан]
   Под заголовком и в чеклисте формулировки разные — иначе один и тот же
   текст дублируется на экране дважды. */
const LD = [
  ['Reading your academic profile',
   'Reading your academic profile',            'Academic profile read'],
  ['Rating everything outside the classroom',
   'Scoring your activities and honors',       'Activities and honors scored'],
  ['Testing your profile against real admit data',
   'Comparing against admitted students',      'Compared against admitted students'],
  ['Working through your essay line by line',
   'Grading your essay on six criteria',       'Essay graded on six criteria'],
  ['Estimating your aid, school by school',
   'Modelling financial aid',                  'Financial aid modelled'],
  ['Working out your odds at every school on your list',
   'Calculating your acceptance odds',         'Acceptance odds calculated']
];
const CIRC = 2 * Math.PI * 88;
const TICK_SVG = '<svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
const PULSE = '<span class="ld-pulse"></span>';
const stepHTML = (pair,i) =>
  `<div class="ldc-s" id="ld-${i}"><span class="ldc-i" id="ldd-${i}">${PULSE}</span>
     <span id="ldt-${i}">${pair[1]}</span></div>`;
document.getElementById('ld-steps').innerHTML =
  '<div class="ldc-col">' + LD.filter((_,i)=>i%2===0).map((p,k)=>stepHTML(p,k*2)).join('') + '</div>' +
  '<div class="ldc-col">' + LD.filter((_,i)=>i%2===1).map((p,k)=>stepHTML(p,k*2+1)).join('') + '</div>';

(function runLoad(){
  /* timer-driven rather than requestAnimationFrame: rAF stalls when the tab is
     backgrounded (or under a headless virtual clock) and the screen never advances */
  const DUR = 15000, TICK = 60;   /* 15 s / 6 шагов = ровно 2,5 с на шаг */
  const ring = document.getElementById('ring'), pct = document.getElementById('ring-p'),
        pctN = document.getElementById('ring-n');
  const t0 = Date.now();
  let lastActive = -1, lastFinished = null;
  const stepState = new Array(LD.length).fill(null);
  const id = setInterval(function(){
    const p = Math.min(1, (Date.now()-t0)/DUR);
    const eased = 1 - Math.pow(1-p, 1.7);
    const v = Math.round(eased*100);
    pctN.textContent = v;
    pct.classList.toggle('full', v >= 100);
    ring.setAttribute('stroke-dashoffset', String(CIRC*(1-eased)));
    const active = Math.min(LD.length-1, Math.floor(p*LD.length));

    /* Подпись под заголовком следует за активным шагом. Меняем только при
       смене шага, иначе перезапуск анимации на каждом тике таймера. */
    const finished = p >= 1;

    if(active !== lastActive || finished !== lastFinished){
      lastActive = active; lastFinished = finished;
      const now = document.getElementById('ld-now');
      const line = now.parentElement;
      line.style.opacity = '0';
      setTimeout(function(){
        /* На 100% всё закрыто: галочка вместо спиннера, зелёный, прошедшее время */
        now.textContent = finished ? LD[LD.length-1][2] : LD[active][0];
        document.getElementById('ld-nowi').innerHTML =
          finished ? TICK_SVG : '<span class="ld-spin"></span>';
        line.classList.toggle('done', finished);
        line.style.opacity = '1';
      }, 170);

      document.getElementById('ring-l').textContent = finished ? 'Analyzed' : 'Analyzing';

      const st = document.getElementById('ld-status');
      st.textContent = finished ? 'Done' :
        (active < 2 ? 'Getting started' : (active < 4 ? 'Working through it' : 'Almost there'));
    }

    /* Раньше innerHTML переписывался каждые 60 мс — спиннер пересоздавался
       16 раз в секунду и его анимация стартовала заново. Теперь трогаем
       узел только когда состояние шага действительно изменилось. */
    for(let i=0;i<LD.length;i++){
      const isDone = (p>=1) || i<active, isAct = (p<1) && i===active;
      const state = isDone ? 'done' : (isAct ? 'act' : 'idle');
      if(stepState[i] === state) continue;
      stepState[i] = state;

      const el=document.getElementById('ld-'+i), d=document.getElementById('ldd-'+i);
      el.classList.toggle('done', isDone);
      el.classList.toggle('act', isAct);
      document.getElementById('ldt-'+i).textContent = isDone ? LD[i][2] : LD[i][1];
      d.innerHTML = isDone ? TICK_SVG
                  : (isAct ? '<span class="ld-spin"></span>' : PULSE);
    }
    if(p>=1){ clearInterval(id); setTimeout(function(){ window.location.href = 'signup.html'; }, 900); }
  }, TICK);
})();

</script>
</body>
</html>
